_target_: src.models.latent_ae_diffusion_module.LatentAEDiffusionLitModule

latent_ae_ckpt: ${paths.root_dir}/../XtoCIF/runs/latent_ae_xtocif/ckpt.pt
latent_ae_config: ${paths.root_dir}/../XtoCIF/configs/latent_ae_xtocif.yaml
prefer_best: true
latent_tokens: 32
latent_dim: 1024
ae_max_input_tokens: 1522
condition: true

xrd_augmentation:
  qmin: 0.0
  qmax: 10.0
  qstep: 0.01
  fwhm_range_min: 0.001
  fwhm_range_max: 0.10
  eta_range_min: 0.5
  eta_range_max: 0.5
  noise_range_min: 0.001
  noise_range_max: 0.05
  intensity_scale_range_min: 0.95
  intensity_scale_range_max: 1.0
  mask_prob: 0.1

denoiser:
  _target_: src.models.denoisers.dit.DiT
  d_x: ${..latent_dim}
  d_model: 768
  nhead: 12
  num_layers: 12
  num_datasets: 1
  num_spacegroups: 1
  class_dropout_prob: 0.0
  cond_dim: 1000

interpolant:
  _target_: src.models.interpolants.flow_matching.FlowMatchingInterpolant
  min_t: 1e-2
  corrupt: True
  num_timesteps: 100
  self_condition: true
  self_condition_prob: 0.5
  centered: false

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 0.0001
  weight_decay: 0.0
  fused: true

scheduler: null

scheduler_frequency: ${trainer.check_val_every_n_epoch}

# compile model for faster training with pytorch 2.0
compile: true
