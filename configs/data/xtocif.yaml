datamodule:
  _target_: src.data.xtocif_datamodule.XtoCifDataModule

  dataset_root: ${paths.root_dir}/../crystallography/data/noma
  condition: true

  batch_size:
    train: 128
    val: 128
    test: 128

  num_workers:
    train: 8
    val: 8
    test: 8

  pin_memory: true
  persistent_workers: true
  prefetch_factor: 4
